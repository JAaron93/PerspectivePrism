# Qodo PR Compliance Checklist
# Repository hard compliance rules and security invariants verified by Qodo review agent on every Pull Request

requirement_checks:
  - id: llm-input-sanitization-boundary
    name: "LLM Input Sanitization Guardrail"
    description: "All user-supplied content transmitted to LLM providers must pass through app/utils/input_sanitizer.py."
    condition: "files.contains('backend/app/')"
    pass_condition: "No LLM execution paths bypass input_sanitizer.py sanitization rules."
    severity: "CRITICAL"

  - id: chrome-extension-mv3-service-worker
    name: "Manifest V3 Service Worker Architecture"
    description: "Chrome extension background processing must strictly adhere to event-driven Service Worker specifications."
    condition: "files.contains('chrome-extension/')"
    pass_condition: "No persistent background page state or legacy MV2 API patterns exist in background.js."
    severity: "HIGH"

  - id: mv3-dual-utility-script-preservation
    name: "Dual Utility Script Invariant"
    description: "Shared extension utilities must maintain both module (.js) and manifest script (-script.js) variants."
    condition: "files.contains('chrome-extension/config') || files.contains('chrome-extension/logging-utils')"
    pass_condition: "Script variants (config-script.js, logging-utils-script.js) are preserved for manifest script injection."
    severity: "HIGH"

  - id: personal-project-scope-boundary
    name: "Personal Portfolio Architecture Boundary"
    description: "Prevent over-engineering (ORMs, Celery, Redis, Docker, Datadog/Sentry, microservices, RBAC)."
    condition: "files.contains('backend/') || files.contains('frontend/') || files.contains('chrome-extension/')"
    pass_condition: "PR contains no enterprise infrastructure or complex persistence abstraction additions."
    severity: "HIGH"

  - id: four-perspective-alignment
    name: "Four-Perspective Consistency Check"
    description: "Perspective claims must strictly align with Scientific, Journalistic, Partisan (Left), and Partisan (Right) categories."
    condition: "files.contains('backend/app/services/')"
    pass_condition: "No perspective category string literals deviate from the canonical enum values (Scientific, Journalistic, Partisan (Left), Partisan (Right))."
    severity: "MEDIUM"

  - id: wcag-a11y-keyboard-accessibility
    name: "WCAG 2.1 AA Keyboard Navigation Standards"
    description: "Injected Chrome extension UI must maintain focus management, ARIA live regions, and avoid keyboard traps."
    condition: "files.contains('chrome-extension/claim-navigator.js')"
    pass_condition: "No keyboard focus traps; valid ARIA attributes and focus management logic preserved."
    severity: "MEDIUM"

  - id: vertex-ai-mode-mandatory-paid-tier
    name: "Mandatory 100% GCP Vertex AI Mode (Paid Tier)"
    description: "Backend LLM initialization must exclusively use GCP Vertex AI Mode (via GCP_PROJECT). AI Studio API keys (GEMINI_API_KEY) are prohibited."
    condition: "files.contains('backend/app/')"
    pass_condition: "ClaimExtractor and AnalysisService initialize strictly via configure_provider_env requiring GCP_PROJECT without GEMINI_API_KEY fallbacks."
    severity: "CRITICAL"

  - id: gemini-3-model-invariants
    name: "Gemini 3.x Model Invariants"
    description: "LLM model calls must exclusively use Gemini 3.x series models (gemini-3.5-flash-lite primary, gemini-3.1-flash-lite backup)."
    condition: "files.contains('backend/')"
    pass_condition: "No legacy Gemini 2.x models or non-Google models are referenced in configuration or service code."
    severity: "HIGH"

  - id: env-example-credential-hygiene
    name: "Environment Template Credential Hygiene"
    description: "Ensure .env.example contains GCP_PROJECT= and no committed AI Studio keys or secrets."
    condition: "files.contains('backend/.env.example')"
    pass_condition: "GCP_PROJECT= is included with clear GCP billing usage comments, and no GEMINI_API_KEY references exist."
    severity: "HIGH"

  - id: strict-async-non-blocking-io
    name: "Strict Async I/O & Non-Blocking Event Loop"
    description: "All network operations (LLM model calls, web search, transcript retrieval) must use non-blocking async/await."
    condition: "files.contains('backend/app/')"
    pass_condition: "No synchronous blocking network calls exist in backend services; LLM calls use client.aio and I/O tasks use async def or asyncio.to_thread."
    severity: "HIGH"

  - id: byok-storage-credential-isolation
    name: "BYOK Storage Credential Isolation"
    description: "User API keys and sensitive credentials must be saved strictly in chrome.storage.local instead of chrome.storage.sync."
    condition: "files.contains('chrome-extension/config.js') || files.contains('chrome-extension/options.js')"
    pass_condition: "No API keys or secrets are stored in chrome.storage.sync."
    severity: "CRITICAL"

  - id: ipc-sender-origin-verification
    name: "IPC Message Sender Origin Verification"
    description: "Service Worker background.js must validate sender.id === chrome.runtime.id for all chrome.runtime.onMessage handlers."
    condition: "files.contains('chrome-extension/background.js')"
    pass_condition: "background.js rejects messages where sender.id !== chrome.runtime.id."
    severity: "CRITICAL"

  - id: cws-production-manifest-security
    name: "Chrome Web Store Manifest Security"
    description: "Production manifest.json must be clean of http://localhost host permissions and configure an explicit MV3 CSP."
    condition: "files.contains('chrome-extension/manifest.json')"
    pass_condition: "manifest.json contains no http://localhost host permissions and declares valid extension_pages CSP."
    severity: "HIGH"

  - id: ai-output-dompurify-sanitization
    name: "AI Output DOMPurify Sanitization"
    description: "Dynamic LLM outputs rendered in sidepanel.js must be sanitized via textContent or DOMPurify prior to DOM insertion."
    condition: "files.contains('chrome-extension/sidepanel.js')"
    pass_condition: "Dynamic AI output strings pass through textContent or DOMPurify before DOM rendering."
    severity: "HIGH"
