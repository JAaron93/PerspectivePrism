[package]
name = "prism_sanitizer_rs"
version = "0.1.0"
edition = "2021"

[lib]
name = "prism_sanitizer_rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["extension-module"]
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.29.0" }
regex = "1.10.3"
once_cell = "1.19.0"
unicode-normalization = "0.1.24"
aho-corasick = "1.1.3"

[profile.dev]
opt-level = 3

