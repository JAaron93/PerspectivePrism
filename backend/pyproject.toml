[build-system]
requires = ["setuptools>=61.0", "wheel", "maturin"]
build-backend = "setuptools.build_meta"

[project]
name = "perspective-prism"
version = "0.1.0"
description = "YouTube Perspectivalist dis/misinformation analysis MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Perspective Prism Team" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "youtube-transcript-api",
  "google-genai>=2.23.0,<3.0.0",
  "google-adk>=2.13.0,<3.0.0",
  "pyyaml",
  "prism_sanitizer_rs @ file:prism_sanitizer_rs",
  "opentelemetry-api>=1.39.0,<=1.44.0",
  "opentelemetry-sdk>=1.39.0,<=1.44.0",
  "tabulate>=0.10.0",
  "modal>=1.5.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "pytest-bdd>=9.0.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.benchmarks"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "redteam: prompt-injection red-team suite",
    "eval: mark test as component-level evaluation benchmark",
    "component: mark test as component-level test (runs offline against golden fixtures)",
    "bdd: mark test as a BDD acceptance scenario (Gherkin .feature file)",
]
filterwarnings = [
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning:google\\.adk\\.agents\\..*",
    # Python 3.17 forward-compat guard (added in 4f88aa8): typing._UnionGenericAlias
    # deprecation surfaced by third-party typing consumers. Inert on the current
    # Python 3.10-3.13 floor (never fires on 3.13); kept message-scoped so it
    # cannot mask anything else.
    "ignore:.*_UnionGenericAlias.*is deprecated:DeprecationWarning",
    # --- Bucket B: scoped third-party deprecation filters -----------------
    # All three verified unpatched in the newest in-constraint releases
    # (anyio 4.16.0, starlette 1.10.0, google-genai 2.34.0 / aiohttp 3.14.5).
    # Each filter scopes to the exact warning class AND the exact emitting
    # module (stacklevel-derived origin frame) — no blanket ignores.
    "ignore:_pytest\\.python\\.CallSpec2 has been renamed:_pytest.warning_types.PytestRemovedIn10Warning:anyio\\.pytest_plugin",
    "ignore:Using .httpx. with .starlette\\.testclient. is deprecated:starlette.exceptions.StarletteDeprecationWarning:fastapi\\.testclient",
    "ignore:Inheritance class AiohttpClientSession from ClientSession is discouraged:DeprecationWarning:google\\.genai\\._api_client",
]
