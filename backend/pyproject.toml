[build-system]
requires = ["setuptools>=61.0", "wheel", "maturin"]
build-backend = "setuptools.build_meta"

[project]
name = "perspective-prism"
version = "0.1.0"
description = "YouTube Perspectivalist dis/misinformation analysis MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Perspective Prism Team" }]
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "youtube-transcript-api",
  "google-genai>=2.9.0,<3.0.0",
  "google-adk>=2.4.0,<3.0.0",
  "pyyaml",
  "prism_sanitizer_rs @ file:prism_sanitizer_rs",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.benchmarks"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "redteam: prompt-injection red-team suite",
]
filterwarnings = [
    "ignore:BaseAgentConfig is deprecated:DeprecationWarning",
]
