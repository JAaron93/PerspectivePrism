# PerspectivePrism agents-cli Evaluation Configuration (T6.2, FR23)
# Compatible with: agents-cli eval run --config backend/tests/eval/eval_config.yaml
# Used by: python -m app.evals.cli --adk-eval

version: "1.0"
project: "perspective-prism"

evaluation:
  # Target model for evaluation (benchmark candidate — gemini-3.5-flash-lite vs gemini-3.8-flash)
  model: "gemini-3.5-flash-lite"

  # Concurrency: obeys tier_max_concurrency semaphore limits (NFR4)
  max_concurrency: 5

  # HTTP timeout per evaluation request (120s aligns with ADR 007 zero-throttling standard)
  timeout_seconds: 120

  # Golden dataset paths (relative to backend/)
  datasets:
    pre_classifier: "app/evals/datasets/pre_classifier_golden.json"
    claim_extractor: "app/evals/datasets/claim_extractor_golden.json"
    perspective_stance: "app/evals/datasets/perspective_stance_golden.json"
    bias_deception: "app/evals/datasets/bias_deception_golden.json"
    alethiology: "app/evals/datasets/alethiology_golden.json"

  # Metrics configuration
  # Built-in agents-cli metrics + custom ADK 2.0 judge mappings (FR23)
  metrics:
    - name: "claim_recall"
      type: "custom"
      judge: "app.evals.judges.claim_extraction_judge"
      description: "Semantic claim recall and verifiability precision (FR10)"

    - name: "perspective_faithfulness"
      type: "custom"
      judge: "app.evals.judges.perspective_faithfulness_judge"
      description: "Evidence groundedness and prior knowledge hallucination detection (FR11)"

    - name: "alethiology_neutrality"
      type: "custom"
      judge: "app.evals.judges.alethiology_judge"
      description: "6-theory epistemic classification accuracy and descriptive neutrality (FR12)"

    - name: "hallucination"
      type: "builtin"
      description: "Built-in hallucination detection metric"

    - name: "safety"
      type: "builtin"
      description: "Built-in safety policy compliance metric"

# Artifact output directories (FR21)
output:
  trace_dir: "artifacts/traces"
  report_dir: "artifacts/eval_results"

# agents-cli metric selection & definition pools (FR21, FR23)
metrics_to_run:
  - claim_recall
  - perspective_faithfulness
  - alethiology_neutrality

custom_metrics:
  - name: claim_recall
    description: "Semantic claim recall and verifiability precision (FR10)"
    custom_function: |
      def evaluate(instance):
          meta = instance.get("metadata") or {}
          comp = meta.get("component", "")
          mname = meta.get("metric_name", "")
          if comp == "extractor" or "claim" in mname or mname in ("claim_recall", "timestamp_iou"):
              score = meta.get("score")
              if score is not None:
                  return {"score": float(score)}
          responses = instance.get("responses") or []
          if responses:
              try:
                  import json
                  resp_text = responses[0].get("response", {}).get("parts", [{}])[0].get("text", "{}")
                  data = json.loads(resp_text)
                  if "recall_at_iou" in data:
                      return {"score": float(data["recall_at_iou"])}
                  if "gold_count" in data and data["gold_count"] > 0:
                      return {"score": float(data.get("matched_claims", 0)) / float(data["gold_count"])}
              except Exception:
                  pass
          return {"score": 0.0}

  - name: perspective_faithfulness
    description: "Evidence groundedness and prior knowledge hallucination detection (FR11)"
    custom_function: |
      def evaluate(instance):
          meta = instance.get("metadata") or {}
          comp = meta.get("component", "")
          mname = meta.get("metric_name", "")
          if comp == "perspective" or "perspective" in mname or mname in ("perspective_faithfulness", "stance_f1"):
              score = meta.get("score")
              if score is not None:
                  return {"score": float(score)}
          responses = instance.get("responses") or []
          if responses:
              try:
                  import json
                  resp_text = responses[0].get("response", {}).get("parts", [{}])[0].get("text", "{}")
                  data = json.loads(resp_text)
                  if "faithfulness_score" in data:
                      return {"score": float(data["faithfulness_score"])}
                  if "f1_score" in data and comp == "perspective":
                      return {"score": float(data["f1_score"])}
              except Exception:
                  pass
          return {"score": 0.0}

  - name: alethiology_neutrality
    description: "6-theory epistemic classification accuracy and descriptive neutrality (FR12)"
    custom_function: |
      def evaluate(instance):
          meta = instance.get("metadata") or {}
          comp = meta.get("component", "")
          mname = meta.get("metric_name", "")
          if comp == "alethiology" or "alethiology" in mname or mname in ("alethiology_neutrality", "alethiology_accuracy"):
              score = meta.get("score")
              if score is not None:
                  return {"score": float(score)}
          responses = instance.get("responses") or []
          if responses:
              try:
                  import json
                  resp_text = responses[0].get("response", {}).get("parts", [{}])[0].get("text", "{}")
                  data = json.loads(resp_text)
                  if "neutrality_score" in data:
                      return {"score": float(data["neutrality_score"])}
                  if "theory_f1" in data:
                      return {"score": float(data["theory_f1"])}
              except Exception:
                  pass
          return {"score": 0.0}

